name: map-service

services:
  postgres:
    image: postgis/postgis:16-3.6
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      CANONICAL_DB_PASSWORD: ${CANONICAL_DB_PASSWORD:?Set CANONICAL_DB_PASSWORD in .env}
      RENDER_DB_PASSWORD: ${RENDER_DB_PASSWORD:?Set RENDER_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  canonical-importer:
    build:
      context: ../canonical-importer
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: canonical
      DB_USER: canonical_owner
      DB_PASSWORD: ${CANONICAL_DB_PASSWORD}
    volumes:
      - ../data:/data:ro

  editor-api:
    build:
      context: ..
      dockerfile: editor-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EDITOR_API_ADDR: 0.0.0.0:4173
      CANONICAL_DB_HOST: postgres
      CANONICAL_DB_PORT: 5432
      CANONICAL_DB_NAME: canonical
      CANONICAL_DB_USER: canonical_owner
      CANONICAL_DB_PASSWORD: ${CANONICAL_DB_PASSWORD}
      RENDER_DB_HOST: postgres
      RENDER_DB_PORT: 5432
      RENDER_DB_NAME: render
      RENDER_DB_USER: render_owner
      RENDER_DB_PASSWORD: ${RENDER_DB_PASSWORD}
    ports:
      - "${EDITOR_API_PORT:-4173}:4173"

  render-sync-worker:
    build:
      context: ..
      dockerfile: editor-api/Dockerfile
      target: render-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CANONICAL_DB_HOST: postgres
      CANONICAL_DB_PORT: 5432
      CANONICAL_DB_NAME: canonical
      CANONICAL_DB_USER: canonical_owner
      CANONICAL_DB_PASSWORD: ${CANONICAL_DB_PASSWORD}
      RENDER_DB_HOST: postgres
      RENDER_DB_PORT: 5432
      RENDER_DB_NAME: render
      RENDER_DB_USER: render_owner
      RENDER_DB_PASSWORD: ${RENDER_DB_PASSWORD}
      RENDER_DB_SCHEMA: render
      RENDER_OSC_DIR: /var/lib/map-service/osc
      TILE_DIRTY_MIN_ZOOM: ${TILE_DIRTY_MIN_ZOOM:-14}
      TILE_DIRTY_MAX_ZOOM: ${TILE_DIRTY_MAX_ZOOM:-18}
    volumes:
      - render-osc:/var/lib/map-service/osc
    restart: unless-stopped

  osm2pgsql:
    image: iboates/osm2pgsql:latest
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${RENDER_DB_PASSWORD}
    volumes:
      - ../data:/data:ro

  tile-server:
    image: ghcr.io/nvlhuongnoi2005/webgis/tile-server:26.9
    profiles: ["tiles"]
    environment:
      DATA_DIR: /tile-server/data
      LISTEN_PORT: 8080
      NUM_OF_PROCESS: 1
      NUM_OF_THREAD: 2
      RESTART_AFTER_CONFIG_CHANGE: "false"
    ports:
      - "${TILE_SERVER_PORT:-8081}:8080"
    volumes:
      - ./tile-server-data:/tile-server/data

volumes:
  postgis-data:
  render-osc:
